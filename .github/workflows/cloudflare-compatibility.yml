name: Cloudflare compatibility check

on:
  push:
    branches:
      - migrate/cloudflare-workers
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  vinext-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current application dependencies
        run: npm install --no-audit --no-fund

      - name: Check vinext compatibility
        run: npx --yes vinext@1.4.5 check
